<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="879" viewBox="0 0 1260 879" role="img" aria-labelledby="title desc">
<title id="title">AdAstra · Première ébauche du pont 2</title>
<desc id="desc">Plan à l’échelle du secteur du turbolift. Depuis la cabine, le palier de cinq mètres rejoint en T le couloir principal de vingt-six mètres. À droite, une porte donne sur la salle de coordination. Les deux extrémités du couloir sont ouvertes pour de futurs raccords. L’implantation est une proposition pour AdAstra.</desc>
<defs>
  <g id="cabine">
      <path d="M-24 0V13L-49 29V77L-11 102H11L49 77V29L24 13V0Z" fill="#daeee6"/>
      <path d="M-24 0V13L-49 29V77L-11 102H11L49 77V29L24 13V0"
            fill="none" stroke="#376357" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M-24 0H24" stroke="#376357" stroke-width="2" stroke-dasharray="4 3"/>
    </g>
  <pattern id="grid" width="27" height="27" patternUnits="userSpaceOnUse">
    <path d="M27 0H0V27" fill="none" stroke="#e7edf3"/>
  </pattern>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
    <path d="M0 0V7" stroke="#94a9bc" stroke-width="1.1" opacity=".65"/>
  </pattern>
  <marker id="route-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0 0 7 3.5 0 7Z" fill="#178063"/>
  </marker>
  <marker id="grey-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0 0 7 3.5 0 7Z" fill="#60798d"/>
  </marker>
</defs>
<style>
text{font-family:'DejaVu Sans',sans-serif;fill:#193449}
.title{font-size:40px;font-weight:700} .sub{font-size:17px;fill:#50697e}
.section{font-size:23px;font-weight:700} .label{font-size:16px;font-weight:700}
.note{font-size:14px;fill:#486477} .tiny{font-size:12px;fill:#486477}
.step{font-size:15px;font-weight:700;fill:#fff;text-anchor:middle}
.num{fill:#178063;stroke:white;stroke-width:2}
.wall{fill:none;stroke:#3b566b;stroke-width:3;stroke-linejoin:round}
.cont{fill:none;stroke:#60798d;stroke-width:1.8;stroke-dasharray:5 5}
.guide{fill:none;stroke:#5e778d;stroke-width:1.45}
.route{fill:none;stroke:#178063;stroke-width:4;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:8 6;marker-end:url(#route-arrow)}
</style>
<rect width="1260" height="879" fill="#f3f7fa"/>
<text x="35" y="58" class="title">Pont 2 · Première ébauche</text>
<text x="37" y="88" class="sub">AdAstra · Secteur du turbolift · Implantation proposée</text>
<rect x="30" y="116" width="856" height="716" rx="15" fill="white" stroke="#cedae6"/>
<rect x="905" y="116" width="325" height="716" rx="15" fill="white" stroke="#cedae6"/>
<rect x="51" y="139" width="814" height="666" fill="url(#grid)"/>

<path d="M739 202L703.1 156.5" stroke="#60798d" stroke-width="1.8" marker-end="url(#grey-arrow)"/>
<text x="685" y="164" text-anchor="end" class="note">Proue</text>

<!-- Géométrie locale à 27 unités par mètre. Origine au milieu du seuil. -->
<g id="secteur" transform="translate(378 630)">
  <rect x="-297" y="-237.6" width="702" height="102.6" fill="#d9e8f4"/>
  <rect x="-51.3" y="-135" width="102.6" height="135" fill="#eaf2fa"/>
  <rect x="54" y="-399.6" width="216" height="162" fill="#e3eee8"/>
  <rect x="-42.525" y="0" width="85.05" height="78.3" fill="url(#hatch)" stroke="#6d899e" stroke-width="1.7" stroke-dasharray="5 3"/>
  <path d="M-297 -237.6H54 M270 -237.6H405 M-297 -135H-51.3V0H-16.2 M16.2 0H51.3V-135H405" class="wall"/>
  <path d="M140.4 -237.6H54V-399.6H270V-237.6H183.6" class="wall"/>
  <path d="M140.4 -237.6H183.6" stroke="#178063" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M-297 -237.6V-135 M405 -237.6V-135" class="cont"/>
  <use href="#cabine" transform="scale(.675)"/>
  <rect x="195" y="-373" width="45" height="66" rx="10" fill="#a7bcae" stroke="#688477"/>
  <g fill="#c8d9ce" stroke="#688477">
    <rect x="179" y="-356" width="14" height="15" rx="4"/>
    <rect x="179" y="-336" width="14" height="15" rx="4"/>
    <rect x="243" y="-356" width="14" height="15" rx="4"/>
    <rect x="243" y="-336" width="14" height="15" rx="4"/>
  </g>
  <path id="parcours" d="M0 41.85V-186.3H162V-324" class="route"/>
</g>

<text x="88" y="358" class="note">Suite à définir</text>
<path d="M107 477H59" class="cont" marker-end="url(#grey-arrow)"/>
<path d="M755 477H820" class="cont" marker-end="url(#grey-arrow)"/>
<text x="810" y="522" text-anchor="end" class="note">Suite à définir</text>
<text x="104" y="427" class="label">Couloir principal</text>
<text x="104" y="453" class="note">26 m × 3,8 m</text>
<text x="434" y="201" class="label">Salle de coordination</text>
<text x="434" y="222" class="note">8 m × 6 m</text>
<path d="M561.6 392.4L580 378H660L672 366H697" class="guide"/>
<text x="705" y="369" class="note">Porte · 1,6 m</text>
<path d="M433 551H467" class="guide"/>
<text x="476" y="546" class="label">Palier</text>
<text x="476" y="569" class="note">5 m × 3,8 m</text>
<path d="M323 647H253" class="guide"/>
<text x="246" y="650" text-anchor="end" class="label">Turbolift</text>
<text x="246" y="674" text-anchor="end" class="note">Vers la passerelle au pont 1</text>
<path d="M423 695H466" class="guide"/>
<text x="476" y="699" class="note">Réservation de gaine · provisoire</text>

<circle cx="378" cy="671.85" r="12" class="num"/><text x="378" y="677" class="step">1</text>
<circle cx="378" cy="530" r="12" class="num"/><text x="378" y="535" class="step">2</text>
<circle cx="458" cy="443.7" r="12" class="num"/><text x="458" y="449" class="step">3</text>
<circle cx="540" cy="350" r="12" class="num"/><text x="540" y="355" class="step">4</text>
<path d="M89 760h67.5v7H89Z" fill="#29475e"/><path d="M156.5 760H224v7H156.5Z" fill="white" stroke="#29475e"/>
<text x="89" y="789" class="note">0</text><text x="156.5" y="789" text-anchor="middle" class="note">2,5</text><text x="224" y="789" text-anchor="end" class="note">5 m</text>

<text x="928" y="157" class="section">Parcours</text>
<text x="928" y="190" class="label">≈ 20 m depuis la cabine</text>
<text x="928" y="213" class="note">jusqu’au point indiqué dans la salle.</text>

<circle cx="941" cy="265" r="12" class="num"/><text x="941" y="270" class="step">1</text>
<text x="964" y="270" class="label">Sortir du turbolift</text>
<text x="964" y="293" class="note">Passage d’environ 1,2 m.</text>
<circle cx="941" cy="341" r="12" class="num"/><text x="941" y="346" class="step">2</text>
<text x="964" y="346" class="label">Traverser le palier</text>
<text x="964" y="369" class="note">5 m jusqu’au raccord en T.</text>
<circle cx="941" cy="417" r="12" class="num"/><text x="941" y="422" class="step">3</text>
<text x="964" y="422" class="label">Tourner à droite</text>
<text x="964" y="445" class="note">Puis suivre le couloir principal.</text>
<circle cx="941" cy="493" r="12" class="num"/><text x="941" y="498" class="step">4</text>
<text x="964" y="498" class="label">Entrer dans la salle</text>
<text x="964" y="521" class="note">Première destination du pont 2.</text>
<path d="M928 558h277" stroke="#dae3ea"/>
<text x="928" y="590" class="label">Liaison avec le pont 1</text>
<text x="928" y="617" class="note">Gaine verticale avec 4 m de</text>
<text x="928" y="638" class="note">dénivelé provisoire entre planchers.</text>

<text x="928" y="698" class="label">Périmètre du dessin</text>
<text x="928" y="725" class="note">Les deux extrémités du couloir</text>
<text x="928" y="746" class="note">permettent de prolonger le plan.</text>

<text x="34" y="857" class="note">Implantation et dimensions de travail · Vue locale de dessus · Raccord au palier v01</text>
</svg>
