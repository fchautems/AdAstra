<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1015" viewBox="0 0 1420 1015" role="img" aria-labelledby="title desc">
<title id="title">AdAstra · Plan d’ensemble du pont 2</title>
<desc id="desc">Ébauche à l’échelle du pont 2. Le contour elliptique est une estimation à partir du profil. Le palier et le couloir existants sont reliés par deux branches prolongées en une boucle vers la proue. La pièce près du couloir reste sans affectation.</desc>
