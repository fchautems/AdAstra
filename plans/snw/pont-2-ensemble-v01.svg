        fill="none" stroke="#385e7c" stroke-width=".2"/>
  <path d="M-1.9 -5H1.9V0H-1.9Z" fill="#d6e7f2"/>
  <path d="M-1.9 -5V0H-.6M.6 0H1.9V-5" fill="none" stroke="#385e7c" stroke-width=".2"/>
  <rect x="2" y="-14.8" width="8" height="6" fill="#e9e4f0"/>
  <path d="M5.2 -8.8H2V-14.8H10V-8.8H6.8" fill="none" stroke="#766387" stroke-width=".22"/>
  <path d="M5.2 -8.8H6.8" stroke="#766387" stroke-width=".14" stroke-dasharray=".23 .18"/>
