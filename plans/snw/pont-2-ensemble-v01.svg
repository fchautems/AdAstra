<circle cx="1195.45" cy="472.73" r="11" class="key"/><text x="1195.45" y="477.73" class="letter">C</text>
<circle cx="1100.2" cy="578.14" r="11" class="key"/><text x="1100.2" y="583.14" class="letter">D</text>
