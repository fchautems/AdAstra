<text x="845" y="843" class="legend"><tspan font-weight="700">B</tspan> · Couloir de l’ébauche</text>
<text x="1110" y="811" class="legend"><tspan font-weight="700">C</tspan> · Boucle proposée vers la proue</text>
<text x="1110" y="843" class="legend"><tspan font-weight="700">D</tspan> · Pièce sans affectation</text>
<path d="M845 871H1364" stroke="#d8e3ed"/>
