      <path d="M40 0H0V40" fill="none" stroke="#e9eef4"/>
    </pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.7" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#376357"/>
    </marker>
