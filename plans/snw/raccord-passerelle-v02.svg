<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1030" viewBox="0 0 1320 1030" role="img" aria-labelledby="title description">
  <title id="title">Du couloir à la passerelle – raccord 2D</title>
  <desc id="description">Deux vues de dessus à la même échelle. À gauche, un couloir témoin rejoint la cabine à son arrêt de départ. À droite, la même cabine débouche directement à l’arrière bâbord de la passerelle. Le pont de départ et le dénivelé restent à déterminer.</desc>
