<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1270" viewBox="0 0 960 1270" role="img" aria-labelledby="title desc">
<title id="title">AdAstra · Plan d’ensemble du pont 2</title>
<desc id="desc">La vue de dessus montre l’enveloppe de travail complète du pont, la proue en haut et bâbord à gauche. Au sortir du turbolift, un palier de 5 mètres rejoint un carrefour sur la galerie centrale. Celle-ci traverse un anneau desservant l’avant et l’arrière. Quatre zones restent à affecter. Le contour de plancher et les dégagements en hauteur restent à vérifier.</desc>
<defs>
  <linearGradient id="fond" x2="1" y2="1"><stop stop-color="#14283a"/><stop offset="1" stop-color="#08131f"/></linearGradient>
  <radialGradient id="coque" cx="50%" cy="43%" r="69%"><stop stop-color="#223e53"/><stop offset="1" stop-color="#142839"/></radialGradient>
  <pattern id="grille" x="480" y="635" width="61.75" height="61.75" patternUnits="userSpaceOnUse"><path d="M61.75 0 H0 V61.75" fill="none" stroke="#97bacb" opacity=".21"/></pattern>
  <clipPath id="contour"><ellipse cx="480" cy="680.8120" rx="296.4" ry="438.425"/></clipPath>
  <marker id="sortie" markerWidth="5" markerHeight="5" refX="4.35" refY="2.5" orient="auto"><path d="M0 0 5 2.5 0 5Z" fill="#ffdd9b"/></marker>
</defs>
