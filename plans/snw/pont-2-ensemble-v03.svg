  .label {font-size:19px;font-weight:700}
  .petit {font-size:15px;fill:#c0d1db}
  .zone {font-size:18px;font-weight:700;fill:#dce7f0;text-anchor:middle}
  .galerie {font-size:16px;font-weight:700;fill:#cefff2;text-anchor:middle}
  .halo {stroke:#122737;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}
</style>
