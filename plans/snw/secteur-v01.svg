  <path d="M799.2 194 H920.8 V354 H799.2Z" fill="#fcf2de" opacity=".62"/>
  <path d="M799.2 194 H920.8" stroke="#a56d25" stroke-width="2" stroke-dasharray="3 5"/>
  <path d="M799.2 354 H840.8 M879.2 354 H920.8" stroke="#a56d25" stroke-width="3" stroke-dasharray="7 5"/>
  <use href="#lift" transform="translate(860 354)"/>
  <path class="route" d="M860 404 V220"/>
  <text x="639" y="237" class="label hyp">Couloir témoin</text>
  <path class="leader" d="M758 232 H793"/>
  <text x="642" y="190" class="tiny muted">Limite du témoin</text>
  <path class="leader" d="M756 186 L790 194"/>
  <path class="dim" d="M940 194V354 M933 194H947 M933 354H947 M799.2 177H920.8 M799.2 171V183 M920.8 171V183"/>
  <text x="955" y="278" class="small hyp">5,0 m</text>
  <text x="860" y="172" text-anchor="middle" class="small hyp">≈ 3,8 m</text>
  <path class="leader" d="M895 358 L929 372 H947"/>
  <text x="951" y="370" class="tiny green">Porte</text>
  <text x="951" y="386" class="tiny green">≈ 1,2 m</text>
  <text x="860" y="463" text-anchor="middle" class="label green">Même cabine · ≈ 2,45 × 2,55 m</text>
  <text x="860" y="486" text-anchor="middle" class="small muted">Entrée et sortie par la même porte</text>

  <rect x="642" y="527" width="384" height="78" rx="8" fill="#eef4f8" stroke="#c6d2dd"/>
  <text x="834" y="552" text-anchor="middle" class="label">Trajet proposé entre les deux vues</text>
  <text x="834" y="576" text-anchor="middle" class="small muted">Entrer · changer de palier · ressortir</text>

  <path d="M35 680H66" stroke="#345d81" stroke-width="3"/>
  <text x="75" y="685" class="small">Disposition d’après les références</text>
  <path d="M366 680H396" stroke="#a56d25" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="405" y="685" class="small">Implantation proposée</text>
  <path d="M623 680H653" stroke="#94a4b2" stroke-width="2" stroke-dasharray="5 6"/>
  <text x="662" y="685" class="small">Hors zone</text>
  <path d="M940 680H1036 M940 673V687 M972 675V685 M1004 675V685 M1036 673V687" class="dim"/>
  <text x="940" y="705" text-anchor="middle" class="tiny">0</text>
  <text x="972" y="705" text-anchor="middle" class="tiny">1</text>
  <text x="1036" y="705" text-anchor="middle" class="tiny">3 m</text>
  <text x="34" y="729" class="tiny muted">Échelle graphique commune · cotes de cabine et largeur du couloir estimées sur dessin · voir notes de relevé</text>
</svg>
