<svg xmlns="http://www.w3.org/2000/svg" width="1232" height="935" viewBox="0 0 1232 935" role="img" aria-labelledby="title description">
  <title id="title">Passerelle de commandement – plan 2D</title>
  <desc id="description">Vue de dessus de la passerelle Strange New Worlds. Écran à l’avant, navigation et barre devant le fauteuil du capitaine, consoles en périphérie, escalier arrière, turbolift à bâbord et accès au bureau du capitaine à tribord. Cotes de travail provisoires.</desc>
