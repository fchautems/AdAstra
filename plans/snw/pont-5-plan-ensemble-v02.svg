<title id="title">AdAstra · Du pont 5 au turbolift de la passerelle</title>
<desc id="desc">Le couloir de Pike rejoint un palier proposé exactement sous le seuil arrière bâbord de la passerelle et du pont 2. Une coupe schématique montre le passage proposé aux ponts 3 et 4.</desc>
