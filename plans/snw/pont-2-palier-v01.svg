<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="897" viewBox="0 0 1280 897" role="img" aria-labelledby="title desc">
<title id="title">AdAstra · Raccord du pont 2 à la passerelle</title>
<desc id="desc">Deux vues de dessus à la même échelle et dans la même orientation. L’ascenseur est à l’arrière bâbord. La cabine et son seuil sont alignés entre les deux ponts. Au pont 2, un tronçon de couloir démarre devant la cabine et part vers l’intérieur du vaisseau. Le dénivelé de quatre mètres et la gaine verticale sont des choix d’essai.</desc>
