<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title description">
<title id="title">AdAstra · Pont 5 · Coupe de conception de la cabine de Pike</title>
<desc id="description">Coupe radiale locale à tribord avant. Sol du pont 5 au zéro, niveaux 4 et 3 à quatre et huit mètres, hauteur libre de la cabine trois mètres cinquante. Les fenêtres suivent le pan de coque dessiné à trente degrés vers l’extérieur à partir de la verticale.</desc>
