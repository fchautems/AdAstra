text{font-family:'DejaVu Sans',sans-serif;fill:#193148}
.title{font-size:38px;font-weight:700} .section{font-size:24px;font-weight:700}
.text{font-size:16px} .note{font-size:14px;fill:#456077} .label{font-size:16px;font-weight:700}
.hyp{fill:#845615} .light{fill:#e6f8fa;paint-order:stroke;stroke:#142638;stroke-width:4;stroke-linejoin:round;font-size:15px;font-weight:700}
.cyan{fill:none;stroke:#8fe0ed;stroke-width:2}
</style>
