<text x="638" y="670" class="note">Passerelle</text>
<text x="646" y="721" class="label hyp">Pont 2 proposé</text>
<text x="646" y="741" class="note">Couloir de départ</text>
<path d="M549 663h10v36h-10 M559 681h16" fill="none" stroke="#986321" stroke-width="1.6"/>
<rect x="573" y="669" width="48" height="23" rx="5" fill="#fff8e8"/>
<text x="597" y="686" text-anchor="middle" class="label hyp">4 m</text>
<text x="69" y="851" class="note">Projection de profil · Le seuil du turbolift est à bâbord, hors de l’axe médian.</text>

<rect x="861" y="576" width="367" height="300" rx="8" fill="#fff8e8" stroke="#ead9b0"/>
<text x="884" y="610" class="label hyp">Hypothèses d’implantation</text>
<path d="M884 632h319" stroke="#ead9b0"/>
<text x="884" y="662" class="text" font-weight="700">Pont 2 comme premier arrêt</text>
<text x="884" y="685" class="note">Le palier le plus proche pour l’essai.</text>
<text x="884" y="727" class="text" font-weight="700">4 m entre les planchers</text>
<text x="884" y="750" class="note">Cote de travail révisable.</text>
<text x="884" y="792" class="text" font-weight="700">Gaine à définir</text>
<text x="884" y="815" class="note">La flèche relie les deux arrêts.</text>
<text x="884" y="837" class="note">L’altitude du plancher reste inconnue.</text>

<text x="34" y="949" class="note">Sources · Écran SNW S4E01 reproduit par Ex Astris Scientia · Profil d’après Dávid Metlesits · Raccord AdAstra v02</text>
