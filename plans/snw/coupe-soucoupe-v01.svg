<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" role="img" aria-labelledby="title desc">
<title id="title">AdAstra · Coupe locale de la soucoupe</title>
<desc id="desc">Comparaison entre la coupe visible dans Valles Marineris et un essai de positionnement sous le dôme. Le départ au pont 2, les niveaux de plancher absolus et le dénivelé de quatre mètres sont des hypothèses de conception.</desc>
<defs>
  <clipPath id="reference"><rect x="52" y="185" width="1176" height="255" rx="8"/></clipPath>
  <clipPath id="coque"><path d="M823 201Q868 196 880 187L909 180 914 179 914 175 923 175 923 179 Q933 172 946 172Q959 171 966 178L982 184 998 193 1030 194 1074 203 1076 212 1085 212 1085 229Q1052 232 1030 242L984 258 Q951 278 928 267L913 260Q888 248 852 238L823 238Z"/></clipPath>
  <clipPath id="profil"><rect x="52" y="576" width="791" height="300" rx="8"/></clipPath>
  <marker id="montee" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 0 8 4 0 8Z" fill="#227259"/>
  </marker>
</defs>
