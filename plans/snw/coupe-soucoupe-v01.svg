<text x="34" y="60" class="title">Coupe locale de la soucoupe</text>
<text x="36" y="89" class="text">AdAstra · Enterprise de Pike · Un premier arrêt sous la passerelle</text>

<rect x="30" y="114" width="1220" height="372" rx="14" fill="white" stroke="#cedae6"/>
<text x="52" y="154" class="section">Ce que montre l’écran de « Valles Marineris »</text>
