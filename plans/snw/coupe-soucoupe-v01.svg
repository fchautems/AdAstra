<text x="1228" y="466" text-anchor="end" class="note">Niveaux visibles · Hauteurs et numéros non lisibles</text>

<rect x="30" y="504" width="1220" height="410" rx="14" fill="white" stroke="#cedae6"/>
<text x="52" y="544" class="section">Essai sur le profil de la saison 1</text>
