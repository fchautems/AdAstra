  <line class="wall" x1="23.41" y1="10.35" x2="23.41" y2="16.0"/><line class="wall" x1="23.59" y1="10.35" x2="23.59" y2="16.0"/><line class="wall" x1="31.41" y1="10.35" x2="31.41" y2="16.0"/><line class="wall" x1="31.59" y1="10.35" x2="31.59" y2="16.0"/>

