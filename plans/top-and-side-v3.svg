<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1700"
viewBox="-2 -24 63 74" preserveAspectRatio="xMidYMid meet">
<defs>
  <pattern id="minorGrid" width="1" height="1" patternUnits="userSpaceOnUse">
    <path d="M1 0 L0 0 0 1" fill="none" stroke="#e6eef6" stroke-width="0.045"/>
  </pattern>
  <pattern id="majorGrid" width="5" height="5" patternUnits="userSpaceOnUse">
    <rect width="5" height="5" fill="url(#minorGrid)"/>
    <path d="M5 0 L0 0 0 5" fill="none" stroke="#cfdfec" stroke-width="0.075"/>
  </pattern>
  <style>
    .plan { fill:none; stroke:#000000; stroke-width:0.16; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
    .wall { fill:none; stroke:#000000; stroke-width:0.14; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
    .main { fill:none; stroke:#000000; stroke-width:0.16; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
    .secondary { fill:none; stroke:#000000; stroke-width:0.12; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
    .axis { fill:none; stroke:#000000; stroke-width:0.10; stroke-dasharray:0.65 0.50; vector-effect:non-scaling-stroke; }
    .label { fill:#000000; font-family:Arial,sans-serif; font-size:0.62px; }
    .title { fill:#000000; font-family:Arial,sans-serif; font-size:0.90px; font-weight:bold; }
    .small { fill:#333333; font-family:Arial,sans-serif; font-size:0.52px; }
    .panelTitle { fill:#000000; font-family:Arial,sans-serif; font-size:0.78px; font-weight:bold; }
    .separator { fill:none; stroke:#aab8c4; stroke-width:0.08; stroke-dasharray:0.5 0.35; vector-effect:non-scaling-stroke; }
  </style>
</defs>

<rect x="-2" y="-24" width="63" height="74" fill="#ffffff"/>
<rect x="-2" y="-24" width="63" height="74" fill="url(#majorGrid)"/>

<text class="title" x="-1.2" y="-21.8">AdAstra — vue de dessus + vue de profil — même échelle longitudinale</text>
<text class="small" x="-1.2" y="-20.5">Vue de dessus avec ouvertures de cabines • profil v3 corrigé • 1 carreau = 1 m</text>

